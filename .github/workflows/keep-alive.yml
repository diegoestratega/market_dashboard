name: Keep Streamlit app awake

# Streamlit Community Cloud hibernates an app that gets no traffic for 12 hours.
# This opens a real browser session against the deployment on a schedule, which
# resets that clock, wakes the app if it finds it asleep, and tells us the
# dashboard still renders. See .github/scripts/keep_alive.py for how.
#
# Schedule: hourly, at minute 17 (UTC).
#
# This ran every 11 hours (00:00/11:00/22:00 UTC) from 2026-09-18 to 2026-10-13
# and the app still slept. Of 74 scheduled slots GitHub created 53 runs - from
# Sep 23 on, only two a day - and the 11:00 slot fired between 14:02 and 20:03
# UTC every day, 3 to 9 hours late. 22 of the 52 gaps between runs were longer
# than 12 hours (the longest 19.2), so the app went to sleep around the US
# market open.
#
# Two changes, both straight from GitHub's own guidance on schedule delays:
#   - minute 17, not 0: the top of the hour is when scheduled runs are most
#     delayed and most often dropped
#   - hourly: with runs up to 9 hours late and some skipped outright, every 2h
#     can still leave a 13-hour gap. Hourly survives a skipped run followed by
#     one 9 hours late. Worth re-measuring once there is data at minute 17.
# Free on a public repo; each run is about a minute.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

# Needed only by the heartbeat step at the end.
permissions:
  contents: write

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    # A cold boot after hibernation can take several minutes; the script allows
    # up to 8 for it on top of the session check.
    timeout-minutes: 20
    env:
      APP_URL: https://marketdash1.streamlit.app/
      HOLD_SECONDS: '25'

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Install Playwright
        run: |
          python3 -m pip install --upgrade pip
          # Pinned, same reasoning as requirements.txt: an unpinned bump here
          # could break the ping with no change on our side.
          python3 -m pip install 'playwright==1.56.0'
          python3 -m playwright install --with-deps chromium

      - name: Wake the app and verify it renders
        run: python3 .github/scripts/keep_alive.py

      # Screenshot, page HTML and the platform's status history, so a failed run
      # shows what the runner actually saw instead of leaving it to guesswork.
      - name: Keep the diagnostics if the app did not come up
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: keep-alive-diagnostics
          path: keep-alive-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

      # GitHub automatically disables scheduled workflows in a public repo after
      # 60 days with no repository activity, which would silently kill this whole
      # job. A commit every ~50 quiet days resets that clock. Runs even when the
      # ping above failed, so an app outage cannot also cost us the schedule.
      - name: Heartbeat commit if the repo has been quiet
        if: always()
        run: |
          set -euo pipefail
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))
          echo "Days since last commit: ${days}"
          if [ "${days}" -ge 50 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keep-alive-heartbeat.txt
            git config user.name  'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/keep-alive-heartbeat.txt
            git commit -m 'chore: keep-alive heartbeat so GitHub does not disable the schedule'
            git push
            echo "Heartbeat pushed."
          else
            echo "Repo active recently enough - no heartbeat needed."
          fi
